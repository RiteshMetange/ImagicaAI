<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imagica</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Chat tools">
        <div class="brand"> 
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M24 6c9.9 0 18 6.9 18 15.4S33.9 36.8 24 36.8c-2.1 0-4.1-.3-5.9-.9L9.5 42l2.5-8.8c-3.7-2.8-6-7-6-11.8C6 12.9 14.1 6 24 6Z"></path>
              <path d="M16.5 20.8h15M16.5 27h9.4"></path>
            </svg>
          </div>
          <div>
            <h1>Imagica</h1>
            <p id="model-name">Model</p>
          </div>
        </div>

        <div class="status-row">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Checking</span>
        </div>

        <label class="provider-control" for="provider-select">
          <span>AI model</span>
          <select id="provider-select" aria-label="AI model">
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
          </select>
          <small id="provider-hint">Checking</small>
        </label>

        <button id="clear-chat" class="icon-button wide" type="button" title="Clear chat" aria-label="Clear chat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M6.5 6l1 15h9l1-15"></path>
            <path d="M10 11v5"></path>
            <path d="M14 11v5"></path>
          </svg>
        </button>
      </aside>

      <section class="chat-panel" aria-label="Conversation">
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer">
          <textarea id="message-input" rows="1" placeholder="Message AI Bot" aria-label="Message AI Bot"></textarea>
          <button id="send-button" class="send-button" type="submit" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12h15"></path>
              <path d="M13 6l6 6-6 6"></path>
            </svg>
          </button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
